# إعدادات الموقع العامة
title: علي توفيق
description: مرشد تربوي ومدرّب حاسوب للمكفوفين من البصرة.
url: https://ali.tawfeeq.dev
lang: ar

# منع جيتهاب من أخذ عنوان التبويب من أول عنوان في الصفحة
titles_from_headings:
  enabled: false

# خريطة الموقع لمحركات البحث: ali.tawfeeq.dev/sitemap.xml
plugins:
  - jekyll-sitemap

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

# عنوان كل شرح يكون: ali.tawfeeq.dev/tutorials/اسم-الملف/
permalink: /tutorials/:title/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - Gemfile
  - Gemfile.lock
