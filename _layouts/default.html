<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <a class="skip" href="#main">تخطَّ إلى المحتوى</a>

  <header class="site-head">
    <div class="wrap site-head__inner">
      <a class="brand" href="{{ '/' | relative_url }}">علي توفيق</a>
      <nav aria-label="أقسام الموقع">
        <ul>
          <li><a href="{{ '/#about' | relative_url }}">نبذة</a></li>
          <li><a href="{{ '/#journey' | relative_url }}">المسيرة</a></li>
          <li><a href="{{ '/#skills' | relative_url }}">المهارات</a></li>
          {% if site.posts.size > 0 %}<li><a href="{{ '/tutorials/' | relative_url }}">الشروحات</a></li>{% endif %}
          {% if site.data.links and site.data.links.size > 0 %}<li><a href="{{ '/links/' | relative_url }}">روابط مفيدة</a></li>{% endif %}
          <li><a href="{{ '/#contact' | relative_url }}">التواصل</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main" tabindex="-1">
    {{ content }}
  </main>

  <footer class="site-foot">
    <div class="wrap">
      <p>© {{ 'now' | date: '%Y' }} علي توفيق</p>
    </div>
  </footer>
</body>
</html>
